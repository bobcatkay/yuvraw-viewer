name: 功能建议（简体中文）
description: 描述具体使用场景与可验证的预期行为。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "[English](https://github.com/bobcatkay/yuvraw-viewer/issues/new?template=feature_request.yml)"
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前操作为什么不足？涉及哪些格式、参数或工作步骤？
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 希望的行为和验收方法
      description: 可以用什么公开合成输入或数值结果验证？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的方法（可选）
